[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrscanner"
version = "1.0.0"
description = "Free, private AI document scanner: automatic page detection + high-accuracy OCR"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "pypdfium2>=4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ocr-scan = "ocrscanner.cli:main"

[tool.setuptools]
packages = ["ocrscanner"]

[tool.setuptools.package-data]
ocrscanner = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
